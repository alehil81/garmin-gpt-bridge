services:
  - type: web
    name: garmin-gpt-bridge
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_KEY
        sync: false
      - key: GARMIN_TOKEN_DATABASE_URL
        sync: false
      - key: GARMIN_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.14.3
