services:
  - type: web
    name: garmin-gpt-bridge
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_KEY
        sync: false
      - key: GARMIN_EMAIL
        sync: false
      - key: GARMIN_PASSWORD
        sync: false
      - key: OAUTH1_B64
        sync: false
      - key: OAUTH2_B64
        sync: false
